<title>Degen Union – Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--g:#3df58a;--y:#ffd60a}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:Montserrat,system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 85% 0%,rgba(61,245,138,.35) 0%,rgba(61,245,138,0) 55%),radial-gradient(ellipse at 0% 100%,rgba(61,245,138,.12) 0%,rgba(0,0,0,0) 50%),#050505;display:flex;flex-direction:column;align-items:center;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
body>*{position:relative;z-index:1}
body>#snow,body>#fx,body>#gear,body>#mute{position:fixed}
#logo{width:clamp(40px,8vh,64px);height:auto;flex:none}
.title{display:flex;align-items:baseline;justify-content:center;gap:.25em;line-height:1;margin-top:6px;text-align:center;flex:none;font-family:Anton,Impact,sans-serif;font-size:clamp(28px,min(9.5vw,7.5vh),70px);text-transform:uppercase;text-shadow:3px 3px 0 #000;white-space:nowrap}
.title b{font-weight:400;color:var(--y);text-shadow:3px 3px 0 #000,0 0 40px rgba(255,214,10,.25)}
.tag{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;font-family:'Pinyon Script',cursive;font-size:clamp(26px,min(7vw,5.2vh),46px);line-height:1.2;color:var(--g);text-shadow:0 0 24px rgba(61,245,138,.55)}
.tag::before,.tag::after{content:"";height:1px;width:clamp(24px,8vw,70px);background:linear-gradient(90deg,transparent,var(--g))}
.tag::after{transform:scaleX(-1)}
#stage{flex:1;min-height:0;width:100%;position:relative;display:flex;align-items:center;justify-content:center}
#c{display:block;filter:drop-shadow(0 0 40px rgba(61,245,138,.25))}
button{font:inherit;cursor:pointer}
#spin{flex:none;margin-top:4px;border:2px solid var(--g);border-radius:999px;padding:clamp(10px,2vh,16px) 52px clamp(10px,2vh,16px) 56px;background:rgba(61,245,138,.08);color:var(--y);font-weight:800;font-size:clamp(15px,min(4vw,3vh),20px);letter-spacing:.28em;text-transform:uppercase;box-shadow:0 0 24px rgba(61,245,138,.35);transition:transform .1s;position:relative;overflow:hidden;animation:glow 2.2s ease-in-out infinite}
#spin::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
#spin:hover:not(:disabled){transform:scale(1.04)}
#spin:active:not(:disabled){transform:scale(.94)}
#spin:disabled{cursor:default}
#spin.go{background:var(--g);color:#050505;border-color:#fff;letter-spacing:.14em;padding-left:44px;padding-right:44px;animation:busy .7s ease-in-out infinite}
#spin.go::after{animation:shine 1s linear infinite}
.d{display:inline-block;animation:hop .9s ease-in-out infinite}.d:nth-child(2){animation-delay:.15s}.d:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 14px rgba(61,245,138,.3)}50%{box-shadow:0 0 38px rgba(61,245,138,.8),inset 0 0 16px rgba(61,245,138,.18)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes busy{0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(61,245,138,.6)}50%{transform:scale(1.05);box-shadow:0 0 50px rgba(61,245,138,1)}}
#win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
#win[hidden]{display:none}
#win .card{pointer-events:auto;text-align:center;border:2px solid var(--g);border-radius:16px;padding:14px 24px;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);max-width:92%;animation:pop .6s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 50px rgba(61,245,138,.35)}
#win .lbl{font-size:13px;letter-spacing:.25em;color:var(--g);font-weight:800}
#win .prize{font-family:Anton,Impact,sans-serif;font-size:clamp(26px,7vw,52px);text-transform:uppercase;color:var(--y);line-height:1.1;margin:4px 0 8px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.ghost{background:transparent;color:var(--g);border:1px solid var(--g);border-radius:999px;font-size:12px;padding:7px 16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:3px 4px 0}
#edit{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(96vw,460px);max-height:80dvh;overflow:auto;background:rgba(0,0,0,.94);border:1px solid #1c5a37;border-bottom:0;border-radius:14px 14px 0 0;padding:14px;z-index:10}
#edit[hidden]{display:none}
#edit label{display:block;margin:6px 0;font-size:14px}
#edit textarea{width:100%;height:190px;margin-top:6px;border-radius:10px;border:1px solid #1c5a37;background:#0b0b0b;color:#fff;padding:10px;font:inherit;font-size:14px}
.ib{position:fixed;bottom:10px;z-index:5;width:30px;height:30px;padding:0;border:0;background:transparent;color:#fff;opacity:.12;border-radius:50%;transition:opacity .2s}
.ib:hover,.ib:focus-visible{opacity:.8}
.ib svg{width:18px;height:18px;display:block;margin:6px}
#gear{right:10px}#mute{left:10px}
#snow,#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#snow{z-index:0}#fx{z-index:6}
@media (prefers-reduced-motion:reduce){#spin,#spin::after{animation:none}}
</style></head><body>

<script>
(function(){
var W=window.Wheel,TAU=Math.PI*2,$=function(i){return document.getElementById(i)};
var c=$('c'),t=$('t'),spinB=$('spin'),win=$('win'),rm=$('rm'),ic=$('ic'),snd=$('snd'),fx=$('fx'),stage=$('stage'),edit=$('edit');
var rot=0,phase=0,spinning=false,winner=null,actx=null,size=300;
function entries(){return t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function draw(){var d=Math.min(window.devicePixelRatio||1,2);W.drawWheel(c,Math.round(size*d),entries(),rot,phase,ic.checked?'icon':'text');c.style.width=c.style.height=size+'px'}

layout();
if(window.ResizeObserver)new ResizeObserver(layout).observe(stage);addEventListener('resize',layout);
Promise.all([W.preloadLogo(),document.fonts?Promise.all([document.fonts.load('20px Anton'),document.fonts.load('800 20px Montserrat')]):0]).then(draw,draw);

t.addEventListener('input',draw);ic.addEventListener('change',draw);

 try{var t0=actx.currentTime+(delay||0);

$('mute').onclick=function(){snd.checked=!snd.checked;muteIcon();unlock()};snd.addEventListener('change',muteIcon);

/* confetti */
var parts=[],raf=0;
function confetti(){
 var fc=fx.getContext('2d');fx.width=innerWidth;fx.height=innerHeight;var cols=['#3df58a','#ffd60a','#ffffff','#2bd674'];

}

/* spin */

 (function step(now){
  var p=Math.min(1,(now-t0)/dur),k=1-Math.pow(1-p,4);rot=s+total*k;draw();

  if(p<1){requestAnimationFrame(step)}else{
   winner=e[W.pickWinner(rot,e.length)];spinning=false;spinB.disabled=false;spinB.classList.remove('go');spinB.textContent='Spin';
   $('prize').textContent=winner;win.hidden=false;fanfare();confetti();
  }})(t0);

  t.value=lines.join('\n')}

};
$('close').onclick=function(){win.hidden=true};

/* hidden editor: E key, 3 taps on logo, faint gear */
var n=0,tm;function tog(){edit.hidden=!edit.hidden}

/* christmas: string lights, glow, snow */
(function(){

    x.save();x.globalAlpha=a;x.shadowColor=c2;x.shadowBlur=14;x.fillStyle=c2;x.beginPath();x.ellipse(bx,by,3.2,4.6,0,0,6.283);x.fill();x.restore()}}
  x.fillStyle='rgba(255,255,255,.75)';
